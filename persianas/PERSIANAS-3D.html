ren.setSize(innerWidth, innerHeight); document.body.appendChild(ren.domElement);
const walnut = new THREE.MeshStandardMaterial({color:0x4e3a28,
  metalness:0.05, roughness:0.6});
const gold = new THREE.MeshStandardMaterial({color:0x5d4632,
  metalness:0.05, roughness:0.55});
const slats = [];
for (const [cx,cy,cz,sx,sy,sz,rz,rx] of BOXES){
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),
    rx ? gold : walnut);
  const g = new THREE.Group(); g.position.set(cx-27, cy, cz);
  g.rotation.z = rz*Math.PI/180; m.rotation.x = rx*Math.PI/180;
  g.add(m); scene.add(g); if (rx) slats.push(m);
}
// arch slats: true arc-profiled curve-side ends, still slider-driven
for (const [x0,y,z,t,pts] of ARCS){
  const sh = new THREE.Shape();
  sh.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) sh.lineTo(pts[i][0], pts[i][1]);
  sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, {depth:t, bevelEnabled:false});
  geo.translate(0,0,-t/2);
  const m = new THREE.Mesh(geo, gold);
  const g = new THREE.Group(); g.position.set(x0-27, y, z);
  m.rotation.x = 30*Math.PI/180;
  g.add(m); scene.add(g); slats.push(m);
}

  new THREE.MeshStandardMaterial({color:0x1a2027, side:THREE.DoubleSide}));

  new THREE.MeshStandardMaterial({color:0x233246, transparent:true,
  opacity:.55, side:THREE.DoubleSide}));

let R=170, phi=1.25, th=Math.PI, cy=57, drag=false, px=0, py=0, auto=true;
function place(){ cam.position.set(R*Math.sin(phi)*Math.sin(th),
  cy + R*Math.cos(phi), R*Math.sin(phi)*Math.cos(th));
  cam.lookAt(0, cy, 0); }
addEventListener('pointerdown', e=>{ if(e.target.id==='tr')return;
  drag=true; auto=false; px=e.clientX; py=e.clientY; });
addEventListener('pointerup', ()=>drag=false);
addEventListener('pointermove', e=>{ if(!drag) return;
  th -= (e.clientX-px)*.008;
  phi = Math.min(2.6, Math.max(.2, phi-(e.clientY-py)*.006));
  px=e.clientX; py=e.clientY; });
addEventListener('wheel', e=>{ R=Math.min(600, Math.max(30,
  R*(1+e.deltaY*.001))); });
addEventListener('resize', ()=>{ cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });
document.getElementById('tr').addEventListener('input', e=>{
  const a = +e.target.value; document.getElementById('tv').textContent = a;
  for (const s of slats) s.rotation.x = a*Math.PI/180; });
(function loop(){ requestAnimationFrame(loop);
  if(auto) th += .0025; place(); ren.render(scene, cam); })();

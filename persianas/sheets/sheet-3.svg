iddle" font-weight="bold">FRAME HEAD HALF-RING (x2, one per window)</text><text x="700.0" y="509.7" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">inner R 27, outer R 29-1/2; 2 layers x 4 x 45deg, stagger 22.5deg</text><text x="60.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">SEGMENT BLANKS (rough, grain follows arc)</text><text x="60.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">LEAF ring L1 segment, 30deg</text><text x="360.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">12 (3 x 4 leaves)</text><text x="560.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">14.48 x 3.92 x 5/8</text><text x="60.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">LEAF ring L2 segment, 30deg</text><text x="360.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">8</text><text x="560.0" y="144.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">same blank</text><text x="60.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">LEAF ring L2 segment, 15deg</text><text x="360.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">8</text><text x="560.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">7.55 x 3.23 x 5/8</text><text x="60.0" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">HEAD ring segment, 45deg</text><text x="360.0" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">16 (8 x 2 windows)</text><text x="560.0" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">23.0 x 4.3 x 7/8</text><text x="60.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">METHOD: band-saw segments oversize; face-glue layer 2 over layer 1 with joints staggered;</text><text x="60.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">rout both faces to final radius with a trammel template (R centers marked on story stick);</text><text x="60.0" y="274.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">leaf ring finishes 1-1/4 thick (2 x 5/8), head ring 1-3/4 (2 x 7/8).</text><text x="60.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">The 1/4-round tangent joint at the SPRING is the critical fit: ring meets stile dead-vertical.</text><text x="60.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">ARCH SLAT PIN HOLES: drill into ring INNER face on the slat centerlines (SHEET 4 heights),</text><text x="60.0" y="325.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">holes bored HORIZONTAL (use an angle guide off the story stick), NOT normal to the curve.</text><rect x="12.0" y="770.0" width="1032.0" height="34.0" fill="none" stroke="black" stroke-width="1.5"/><text x="24.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold">PERSIANAS -- PERFORMANCE ROOM  |  BRICKLAID RINGS: leaf quarter-rings + frame head</text><text x="860.0" y="784.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">Amanda+Tyler | BLACK WALNUT | 2 windows</text><text x="860.0" y="798.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">SHEET 3 | build/build.py | 2026-09-28</text></svg>
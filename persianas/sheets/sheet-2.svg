" stroke-width="0.6"/><text x="304.9" y="174.4" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">CENTER stile, drives ALL slats</text><line x1="298.9" y1="276.0" x2="274.9" y2="280.0" stroke="black" stroke-width="0.6"/><text x="304.9" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">CENTER STILE 2" x 114-3/8" (to apex)</text><line x1="298.9" y1="468.0" x2="274.9" y2="472.0" stroke="black" stroke-width="0.6"/><text x="304.9" y="472.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">MID RAIL 3" @ CL 44" AFF</text><line x1="298.9" y1="715.5" x2="274.9" y2="719.5" stroke="black" stroke-width="0.6"/><text x="304.9" y="719.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">BOTTOM RAIL 4-1/2"</text><line x1="126.0" y1="676.0" x2="96.0" y2="702.0" stroke="black" stroke-width="0.6"/><text x="30.0" y="716.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">OUTER STILE 2" x 87-1/2"</text><text x="30.0" y="729.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">(to spring)</text><text x="590.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">PLAN SECTION AT LOUVER (window side up)</text><rect x="590.0" y="150.0" width="400.0" height="12.0" fill="#ddd" stroke="black" stroke-width="1"/><text x="594.0" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="start">WALL / WINDOW PLANE</text><rect x="650.0" y="162.0" width="50.0" height="40.0" fill="none" stroke="black" stroke-width="1.4"/><text x="646.0" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">LEG 2-1/2" face x 2" deep</text><rect x="701.2" y="177.0" width="240.0" height="25.0" fill="none" stroke="black" stroke-width="1.4"/><text x="720.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">LEAF 1-1/4" thick, flush to frame FRONT</text><text x="720.0" y="169.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">3/4" clear to glass (open slat projects 5/8")</text><text x="640.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">JOINERY: rails to stiles = loose tenon 1/2 x 1-1/4</text><text x="640.0" y="367.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">(or Domino 10mm), glued. Ring rail to outer stile:</text><text x="640.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">loose tenon at the spring joint; ring rail to center</text><text x="640.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">stile at the apex: loose tenon.</text><text x="640.0" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">SLATS: 2-1/2" x 5/16", eased edges, pitch 2-1/16".</text><text x="640.0" y="435.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Straight slats 22-11/16"; arch slats SHEET 4.</text><text x="640.0" y="452.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Nylon louver pins both ends: spring pin jamb side,</text><text x="640.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">fixed pin center side. Drill pin holes on the pitch</text><text x="640.0" y="486.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">line BEFORE assembly.</text><text x="640.0" y="503.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">TIP: solid infill above last slat (111-1/2 AFF up).</text><text x="640.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">ASTRAGAL: 3/8 x 1-3/4 on LEFT leaf, full height.</text><text x="640.0" y="537.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">TEST ARTICLE FIRST: one 27x24 bank validates</text><text x="640.0" y="554.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">pitch, tilt feel, pin fit, finish -- then 200 slats.</text><text x="640.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">CONSTRUCTION NOTES</text><rect x="12.0" y="770.0" width="1032.0" height="34.0" fill="none" stroke="black" stroke-width="1.5"/><text x="24.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold">PERSIANAS -- PERFORMANCE ROOM  |  LEAF CONSTRUCTION + PLAN SECTION</text><text x="860.0" y="784.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">Amanda+Tyler | BLACK WALNUT | 2 windows</text><text x="860.0" y="798.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">SHEET 2 | build/build.py | 2026-09-28</text></svg>
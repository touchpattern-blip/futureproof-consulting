ext x="48.0" y="484.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">THE END IS AN ARC, NOT A STRAIGHT BEVEL: rout each curve-side end CONCAVE to R 24-1/2 with</text><text x="48.0" y="501.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">the SAME trammel template used for the ring (SHEET 3), leaned at the listed end angle. The</text><text x="48.0" y="518.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">profiled end nests the ring face at a uniform 1/8 gap. (A straight bevel faired by hand is</text><text x="48.0" y="535.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">within 1/32 and acceptable.) Cut blanks to BLANK length (long point), rout to SHORT side.</text><text x="48.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Fit each C-slat to its bay on the bench: the schedule is the map, the ring is the judge.</text><text x="48.0" y="569.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Pin holes both ends on slat centerline, mid-thickness: spring/friction pin at the RING end,</text><text x="48.0" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">fixed pin at the center-stile end (tilt strip side). Ease profiled corners 1/16; gap holds</text><text x="48.0" y="603.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">through full tilt.</text><text x="720.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">C-SLAT END DETAIL</text><rect x="720.0" y="220.0" width="160.0" height="30.0" fill="none" stroke="black" stroke-width="1.4"/><path d="M 880 220 Q 848 235 872 250" fill="none" stroke="black" stroke-width="1.6"/><text x="720.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">concave arc end (R 24-1/2 template),</text><text x="720.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">leaned at END ANGLE; long point at</text><text x="720.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start">the LOWER corner; 1/8 gap to ring</text><rect x="12.0" y="770.0" width="1032.0" height="34.0" fill="none" stroke="black" stroke-width="1.5"/><text x="24.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold">PERSIANAS -- PERFORMANCE ROOM  |  SLAT SCHEDULE (per leaf; x4 leaves, mirror in pairs)</text><text x="860.0" y="784.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">Amanda+Tyler | BLACK WALNUT | 2 windows</text><text x="860.0" y="798.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">SHEET 4 | build/build.py | 2026-09-28</text></svg>
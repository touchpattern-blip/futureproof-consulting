xt x="700.0" y="198.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Anchor legs + head to framing; leaves hinge off</text><text x="700.0" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">legs, 4x ball-bearing hinges per leaf, leaf</text><text x="700.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">flush to frame FRONT.</text><text x="700.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Leaves: 2 per window, 26-13/16" x 114-3/8" (to apex),</text><text x="700.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">meet on CL with astragal.</text><text x="700.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Clearance behind leaf to glass 3/4";</text><text x="700.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">open louver needs 5/8".</text><text x="700.0" y="317.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">WINDOW 2 ASSUMED IDENTICAL --</text><text x="700.0" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">FIELD-VERIFY BEFORE MILLING.</text><text x="700.0" y="108.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold">GENERAL NOTES</text><rect x="12.0" y="770.0" width="1032.0" height="34.0" fill="none" stroke="black" stroke-width="1.5"/><text x="24.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold">PERSIANAS -- PERFORMANCE ROOM  |  FRONT ELEVATION, face-mount frame + full-arch leaves</text><text x="860.0" y="784.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start">Amanda+Tyler | BLACK WALNUT | 2 windows</text><text x="860.0" y="798.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anc
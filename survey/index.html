      const info=dm.map(e=>{const dx=Math.abs(e.x2-e.x1),dy=Math.abs(e.y2-e.y1);return{dx,dy,len:Math.hypot(dx,dy),feet:parseFeet(e.dim.text)};});
      const hor=info.filter(i=>i.dy<0.35*i.dx), ver=info.filter(i=>i.dx<0.35*i.dy);
      let kx=hor.length?median(hor.map(i=>i.feet*S/i.dx)):null, ky=ver.length?median(ver.map(i=>i.feet*S/i.dy)):null;
      if(kx==null&&ky==null){ const k=median(info.map(i=>i.feet*S/i.len)); kx=ky=k; } else if(kx==null){kx=ky;} else if(ky==null){ky=kx;}
      let sx=0,sy=0,n=0,seen=new Set(); edges.forEach(e=>{ [[e.x1,e.y1],[e.x2,e.y2]].forEach(p=>{const k=Math.round(p[0])+","+Math.round(p[1]); if(seen.has(k))return; seen.add(k); sx+=p[0];sy+=p[1];n++;}); }); const cx=sx/n,cy=sy/n;
      edges.forEach(e=>{ e.x1=cx+(e.x1-cx)*kx; e.y1=cy+(e.y1-cy)*ky; e.x2=cx+(e.x2-cx)*kx; e.y2=cy+(e.y2-cy)*ky; });
      if(SK.spans)SK.spans.forEach(s=>{ ["a","b"].forEach(kk=>{ const p=s[kk]; if(seen.has(Math.round(p[0])+","+Math.round(p[1]))) s[kk]=[cx+(p[0]-cx)*kx,cy+(p[1]-cy)*ky]; }); }); });
    fitView(); SK.scaled=true; save(); render();
    document.getElementById("skhint").textContent="Scaled to dims — all shapes now share one scale (equal feet = equal length)."; }
  function distSeg(p,e){ const dx=e.x2-e.x1,dy=e.y2-e.y1,L2=dx*dx+dy*dy||1; let t=((p[0]-e.x1)*dx+(p[1]-e.y1)*dy)/L2; t=Math.max(0,Math.min(1,t)); const cx=e.x1+t*dx,cy=e.y1+t*dy; return Math.hypot(p[0]-cx,p[1]-cy); }
  function hitEdge(p){ let best=null,bd=24; SK.edges.forEach(e=>{const d=distSeg(p,e); if(d<bd){bd=d;best=e;}}); return best; }
  function hitSpan(p){ let best=null,bd=20; (SK.spans||[]).forEach(s=>{ const d=distSeg(p,{x1:s.a[0],y1:s.a[1],x2:s.b[0],y2:s.b[1]}); if(d<bd){bd=d;best=s;} }); return best; }
  // snap a free tap to nearest vertex, else nearest point on an edge, else grid
  function snapPoint(p){ const v=hitVertex(p); if(v)return [v.x,v.y]; const ed=hitEdge(p); if(ed){ const dx=ed.x2-ed.x1,dy=ed.y2-ed.y1,L2=dx*dx+dy*dy||1; let t=((p[0]-ed.x1)*dx+(p[1]-ed.y1)*dy)/L2; t=Math.max(0,Math.min(1,t)); return [ed.x1+t*dx,ed.y1+t*dy]; } if(GRID!=="off")return snapGrid(p); return p.slice(); }

  // ---- expose for testing ----
  window._skDraw=function(pts){ if(!SK)return 0; const ids=snap(pts); SK.strokes.push({raw:pts,edgeIds:ids}); save(); render(); return SK.edges.length; };
  window._skEdges=function(){ return SK?SK.edges.map(e=>({x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,dim:e.dim})):[]; };
  window._skSetDim=function(i,txt){ if(SK&&SK.edges[i]){ SK.edges[i].dim={inches:parseFeet(txt),text:txt}; save(); render(); } };
  window._skAddSpan=function(a,b,txt){ if(!SK)return 0; SK.spans=SK.spans||[]; SK.spans.push({id:"s"+(SK.nextId++),a:snapPoint(a),b:snapPoint(b),dim:txt?{inches:parseFeet(txt),text:txt}:null}); save(); render(); return SK.spans.length; };
  window._skSpans=function(){ return SK?(SK.spans||[]).map(s=>({a:s.a,b:s.b,dim:s.dim})):[]; };

  // ---- render ----
  function xy(e){ const r=canvas.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
  function sizeCanvas(){ const r=canvas.getBoundingClientRect(); DPR=window.devicePixelRatio||1; canvas.width=Math.max(1,Math.round(r.width*DPR)); canvas.height=Math.max(1,Math.round(r.height*DPR)); }
  function render(){ if(!SK)return; const W=canvas.width,H=canvas.height; ctx.clearRect(0,0,W,H); drawGrid(); ctx.lineCap="round"; ctx.lineJoin="round";
    // ghost ink
    if(SHOWINK){ ctx.strokeStyle="#c9cdd2"; ctx.lineWidth=2*DPR; SK.strokes.forEach(s=>{ ctx.beginPath(); s.raw.forEach((p,i)=> i?ctx.lineTo(p[0]*DPR,p[1]*DPR):ctx.moveTo(p[0]*DPR,p[1]*DPR)); ctx.stroke(); }); }
    // edges
    SK.edges.forEach(e=>{ ctx.beginPath(); ctx.lineWidth=(SEL&&e.id===SEL?4:2.6)*DPR; ctx.strokeStyle=(SEL&&e.id===SEL?"#0d6efd":"#111315"); ctx.moveTo(e.x1*DPR,e.y1*DPR); ctx.lineTo(e.x2*DPR,e.y2*DPR); ctx.stroke(); });
    // vertices
    const isEd=(TOOL==="edit"); const seen=new Set(), deg={};
    SK.edges.forEach(e=>{ [[e.x1,e.y1],[e.x2,e.y2]].forEach(p=>{ const k=Math.round(p[0])+","+Math.round(p[1]); deg[k]=(deg[k]||0)+1; }); });
    SK.edges.forEach(e=>{ [[e.x1,e.y1],[e.x2,e.y2]].forEach(p=>{ const k=Math.round(p[0])+","+Math.round(p[1]); if(seen.has(k))return; seen.add(k);
      if(isEd){ const open=(deg[k]===1); const s=5.5*DPR; ctx.fillStyle="#fff"; ctx.strokeStyle=open?"#c0392b":"#0d6efd"; ctx.lineWidth=(open?2.6:2)*DPR; ctx.beginPath(); ctx.rect(p[0]*DPR-s,p[1]*DPR-s,2*s,2*s); ctx.fill(); ctx.stroke(); }
      else{ ctx.fillStyle="#111315"; ctx.beginPath(); ctx.arc(p[0]*DPR,p[1]*DPR,3.2*DPR,0,7); ctx.fill(); } }); });
    if(dragV&&snapTarget){ ctx.strokeStyle="#1a9850"; ctx.lineWidth=2.6*DPR; ctx.beginPath(); ctx.arc(snapTarget[0]*DPR,snapTarget[1]*DPR,12*DPR,0,7); ctx.stroke(); }
    // dims
    ctx.font=`${13*DPR}px ui-monospace,monospace`; ctx.textAlign="center"; ctx.textBaseline="middle";
    SK.edges.forEach(e=>{ if(e.dim){ const mx=(e.x1+e.x2)/2*DPR,my=(e.y1+e.y2)/2*DPR-9*DPR; ctx.lineWidth=3.5*DPR; ctx.strokeStyle="#fff"; ctx.strokeText(e.dim.text,mx,my); ctx.fillStyle="#111315"; ctx.fillText(e.dim.text,mx,my); } });
    // gap / span dims (freestanding)
    (SK.spans||[]).forEach(s=>{ const ax=s.a[0]*DPR,ay=s.a[1]*DPR,bx=s.b[0]*DPR,by=s.b[1]*DPR;
      const ang=Math.atan2(by-ay,bx-ax), tx=Math.cos(ang+Math.PI/2)*6*DPR, ty=Math.sin(ang+Math.PI/2)*6*DPR;
      ctx.strokeStyle="#d97706"; ctx.lineWidth=1.7*DPR;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.moveTo(ax-tx,ay-ty); ctx.lineTo(ax+tx,ay+ty); ctx.moveTo(bx-tx,by-ty); ctx.lineTo(bx+tx,by+ty); ctx.stroke();
      const lx=(ax+bx)/2+tx*1.9, ly=(ay+by)/2+ty*1.9, lab=s.dim?s.dim.text:"?";
      ctx.lineWidth=3.5*DPR; ctx.strokeStyle="#fff"; ctx.strokeText(lab,lx,ly); ctx.fillStyle="#d97706"; ctx.fillText(lab,lx,ly); });
    if(TOOL==="gap"&&pendingA){ ctx.strokeStyle="#d97706"; ctx.lineWidth=2*DPR; ctx.beginPath(); ctx.arc(pendingA[0]*DPR,pendingA[1]*DPR,8*DPR,0,7); ctx.stroke(); }
    const nd=SK.edges.filter(e=>e.dim).length, ng=(SK.spans||[]).length; document.getElementById("skstat").textContent=`${SK.edges.length} edges · ${nd} dims${ng?" · "+ng+" gap":""}`;
  }
  function renderLive(){ render(); if(curRaw&&curRaw.length){ ctx.beginPath(); ctx.lineWidth=2.2*DPR; ctx.strokeStyle="#0d6efd"; curRaw.forEach((p,i)=> i?ctx.lineTo(p[0]*DPR,p[1]*DPR):ctx.moveTo(p[0]*DPR,p[1]*DPR)); ctx.stroke(); } }

  // ---- pointer ----
  canvas.addEventListener("pointerdown",e=>{ if(!SK)return; if(e.pointerType==="pen")penSeen=true; if(e.pointerType==="touch"&&penSeen&&TOOL==="pen")return;
    const p=xy(e);
    if(TOOL==="dim"){ const ed=hitEdge(p); if(ed) openKeypad(ed); return; }
    if(TOOL==="gap"){ if(pendingA==null){ const hs=hitSpan(p); if(hs){ openSpanKeypad(hs); return; } pendingA=snapPoint(p); render(); }
      else{ const bpt=snapPoint(p); SK.spans=SK.spans||[]; const sp={id:"s"+(SK.nextId++),a:pendingA,b:bpt,dim:null}; SK.spans.push(sp); pendingA=null; save(); openSpanKeypad(sp); } return; }
    if(TOOL==="erase"){ const sp=hitSpan(p); if(sp){ SK.spans=SK.spans.filter(x=>x!==sp); save(); render(); return; } const ed=hitEdge(p); if(ed){ SK.edges=SK.edges.filter(x=>x.id!==ed.id); SK.strokes.forEach(s=>s.edgeIds=s.edgeIds.filter(id=>id!==ed.id)); save(); render(); } return; }
    if(TOOL==="edit"){ const vx=hitVertex(p); if(vx){ dragV={ox:vx.x,oy:vx.y}; activePid=e.pointerId; try{canvas.setPointerCapture(e.pointerId);}catch(_){}; } return; }
    drawing=true; activePid=e.pointerId; try{canvas.setPointerCapture(e.pointerId);}catch(_){}; curRaw=[p]; });
  canvas.addEventListener("pointermove",e=>{ if(dragV&&e.pointerId===activePid){ let np=snapVertex(xy(e),dragV); if(GRID!=="off")np=snapGrid(np); moveVertex(dragV.ox,dragV.oy,np[0],np[1]); dragV.ox=np[0];dragV.oy=np[1]; render(); return; } if(!drawing||e.pointerId!==activePid)return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; evs.forEach(x=>curRaw.push(xy(x))); renderLive(); });
  function endStroke(e){ if(dragV){ dragV=null; snapTarget=null; save(); render(); return; } if(!drawing||(e&&e.pointerId!==activePid))return; drawing=false; if(curRaw&&curRaw.length>2){ const ids=snap(curRaw); SK.strokes.push({raw:curRaw,edgeIds:ids}); save(); } curRaw=null; render(); }
  canvas.addEventListener("pointerup",endStroke); canvas.addEventListener("pointercancel",endStroke); canvas.addEventListener("pointerleave",e=>{ if(drawing)endStroke(e); });

  // ---- keypad ----
  const KEYS=[["7"],["8"],["9"],["'","act"],["4"],["5"],["6"],["\"","act"],["1"],["2"],["3"],["⌫","del"],["0"],[" ","act"],["CLR","del"],["SET","set"]];
  const gk=document.getElementById("skgridkeys");
  KEYS.forEach(k=>{ const b=document.createElement("button"); b.textContent=k[0]==="SET"?"SET":k[0]; if(k[1])b.classList.add(k[1]); b.onclick=()=>keyPress(k[0]); gk.appendChild(b); });
  document.getElementById("kpclose").onclick=closeKeypad;
  function openKeypad(ed){ KPedge=ed; KPspan=null; SEL=ed.id; KPstr=ed.dim?ed.dim.text:""; document.getElementById("kplabel").textContent="Edge dim"; document.getElementById("kpval").textContent=KPstr||"_"; document.getElementById("skkeypad").classList.add("show"); render(); }
  function openSpanKeypad(sp){ KPspan=sp; KPedge=null; SEL=null; KPstr=sp.dim?sp.dim.text:""; document.getElementById("kplabel").textContent="Gap / space dim"; document.getElementById("kpval").textContent=KPstr||"_"; document.getElementById("skkeypad").classList.add("show"); render(); }
  function closeKeypad(){ if(KPspan&&!KPspan.dim){ SK.spans=(SK.spans||[]).filter(s=>s!==KPspan); save(); } document.getElementById("skkeypad").classList.remove("show"); KPedge=null; KPspan=null; SEL=null; render(); }
  function keyPress(k){ if(k==="SET"){ const inch=parseFeet(KPstr); const dim={inches:(inch==null?null:inch),text:KPstr.trim()};
      if(KPedge){ KPedge.dim=dim; } else if(KPspan){ KPspan.dim=KPstr.trim()?dim:null; } save(); closeKeypad(); return; }
    if(k==="CLR"){ KPstr=""; } else if(k==="⌫"){ KPstr=KPstr.slice(0,-1); } else { KPstr+=k; }
    document.getElementById("kpval").textContent=KPstr||"_"; }

  // ---- sheet (basic; full RB frame in a later increment) ----
  function sheet(){ if(!SK||!SK.edges.length){ alert("Draw the outline first."); return; }
    const xs=[],ys=[]; SK.edges.forEach(e=>{xs.push(e.x1,e.x2);ys.push(e.y1,e.y2);}); (SK.spans||[]).forEach(s=>{xs.push(s.a[0],s.b[0]);ys.push(s.a[1],s.b[1]);});
    const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),gw=(maxx-minx)||1,gh=(maxy-miny)||1;
    const VW=1600,VH=1000,M=150,sc=Math.min((VW-2*M)/gw,(VH-2*M)/gh),ox=(VW-gw*sc)/2-minx*sc,oy=(VH-gh*sc)/2-miny*sc;
    const tx=x=>x*sc+ox,ty=y=>y*sc+oy;
    let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" width="100%"><rect x="8" y="8" width="${VW-16}" height="${VH-16}" fill="none" stroke="#000" stroke-width="1.4"/>`;
    s+=`<text x="30" y="42" font-family="Arial" font-size="22" font-weight="700">${esc((typeLabel(CURT.type)||"Sketch")+(CURT.label?" — "+CURT.label:""))}</text>`;
    s+=`<text x="30" y="66" font-family="Arial" font-size="13" fill="#333">${esc(S.meta.venue||"")}${S.meta.quote?" · Q"+esc(S.meta.quote):" · Quote # __________"}${S.meta.surveyor?" · "+esc(S.meta.surveyor):""} · NTS — DIMENSIONED</text>`;
    SK.edges.forEach(e=>{ s+=`<line x1="${tx(e.x1)}" y1="${ty(e.y1)}" x2="${tx(e.x2)}" y2="${ty(e.y2)}" stroke="#000" stroke-width="2.6" stroke-linecap="round"/>`; });
    SK.edges.forEach(e=>{ if(e.dim){ const mx=tx((e.x1+e.x2)/2),my=ty((e.y1+e.y2)/2)-11; s+=`<text x="${mx}" y="${my}" font-family="ui-monospace,monospace" font-size="18" font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">${esc(e.dim.text)}</text>`; } });
    (SK.spans||[]).forEach(sp=>{ const ax=tx(sp.a[0]),ay=ty(sp.a[1]),bx=tx(sp.b[0]),by=ty(sp.b[1]); const ang=Math.atan2(by-ay,bx-ax), px=Math.cos(ang+Math.PI/2)*7,py=Math.sin(ang+Math.PI/2)*7;
      s+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#d97706" stroke-width="1.7"/><line x1="${ax-px}" y1="${ay-py}" x2="${ax+px}" y2="${ay+py}" stroke="#d97706" stroke-width="1.7"/><line x1="${bx-px}" y1="${by-py}" x2="${bx+px}" y2="${by+py}" stroke="#d97706" stroke-width="1.7"/>`;
      const lx=(ax+bx)/2+px*1.7,ly=(ay+by)/2+py*1.7; s+=`<text x="${lx}" y="${ly}" font-family="ui-monospace,monospace" font-size="17" font-weight="700" fill="#d97706" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">${esc(sp.dim?sp.dim.text:"?")}</text>`; });
    s+=`</svg>`;
    const w=window.open("","_blank"); if(!w){ alert("Allow popups to print the sheet."); return; }
    w.document.write(`<!DOCTYPE html><html><head><meta charset=utf-8><title>Sketch Sheet</title><style>@page{size:landscape;margin:.4in}html,body{margin:0}</style></head><body>${s}</body></html>`);
    w.document.close(); w.focus(); setTimeout(()=>{try{w.print();}catch(_){}} ,300); }

  // ---- rail wiring ----
  function setTool(t){ TOOL=t; pendingA=null; ["pen","dim","gap","erase","edit"].forEach(x=>{const b=document.getElementById("t"+x[0].toUpperCase()+x.slice(1)); if(b)b.classList.toggle("on",x===t);}); if(t!=="dim"&&t!=="gap")closeKeypad(); const h={pen:"Pen: draw each edge. Lines straighten & snap square on lift.",dim:"Dim: tap an edge, then type feet-inches (e.g. 6'4) and SET.",gap:"Dim Gap: tap two points (they snap to corners/edges) to dimension a space or border, then type the value. Tap a gap dim to edit it.",erase:"Erase: tap an edge or gap dim to remove it.",edit:"Edit: drag a corner. Red squares = open ends — drag one onto another point to join it (green ring = will snap). Blue = joined."}[t]; document.getElementById("skhint").textContent=h; render(); }
  document.getElementById("tPen").onclick=()=>setTool("pen");
  document.getElementById("tDim").onclick=()=>setTool("dim");
  document.getElementById("tGap").onclick=()=>setTool("gap");
  document.getElementById("tErase").onclick=()=>setTool("erase");
  document.getElementById("tEdit").onclick=()=>setTool("edit");
  document.getElementById("tGrid").onclick=cycleGrid;
  document.getElementById("tScale").onclick=trueUp;
  document.getElementById("tInk").onclick=()=>{ SHOWINK=!SHOWINK; document.getElementById("tInk").classList.toggle("on",SHOWINK); render(); };
  document.getElementById("skUndo").onclick=()=>{ const s=SK.strokes.pop(); if(!s)return; SK.edges=SK.edges.filter(e=>!s.edgeIds.includes(e.id)); save(); render(); };
  document.getElementById("skClear").onclick=()=>{ if(confirm("Clear this sketch?")){ SK.strokes=[]; SK.edges=[]; SK.spans=[]; SK.nextId=1; save(); render(); } };
  document.getElementById("skSheet").onclick=sheet;
  document.getElementById("skDone").onclick=()=>{ closeKeypad(); document.getElementById("skwrap").classList.remove("show"); save(); render(); /* main app */ if(typeof window.__rerender==="function")window.__rerender(); };
  document.getElementById("skback").onclick=()=>document.getElementById("skDone").click();
  window.addEventListener("resize",()=>{ if(document.getElementById("skwrap").classList.contains("show")){ sizeCanvas(); render(); } });

  window.openSketch=function(tid){ const t=S.treatments.find(x=>x.id===tid); if(!t)return; if(!t.sketch)t.sketch={strokes:[],edges:[],spans:[],nextId:1}; if(!t.sketch.spans)t.sketch.spans=[]; SK=t.sketch; CURT=t; penSeen=false; pendingA=null; GRID=SK.grid||"off"; { const gb=document.getElementById("tGrid"); if(gb){ gb.textContent=GRID==="off"?"Grid":(GRID==="sq"?"Grid □":"Grid △"); gb.classList.toggle("on",GRID!=="off"); } } setTool("pen");
    document.getElementById("sktitle").textContent=(typeLabel(t.type)||"Sketch")+(t.label?" — "+t.label:"");
    document.getElementById("skwrap").classList.add("show"); requestAnimationFrame(()=>{ sizeCanvas(); render(); }); };
})();
window.__rerender=render;
// combo picker: ONE delegated change handler, bound ONCE on the stable #app parent (event delegation, NOT rebound per render).
// Picking a .combopick option fully REPLACES the free-type input's value, then dispatching BOTH input+change on that input
// reuses the field's existing save + any targeted derived refresh (refreshDerived/refreshHw/track auto-fill) with NO full
// render, so iOS keyboard focus is preserved. Then the picker resets to its empty (chevron-only) placeholder.
app.addEventListener("change",e=>{
  const sel=e.target; if(!sel||!sel.classList||!sel.classList.contains("combopick"))return;
  if(sel.value==="")return;
  const combo=sel.closest(".combo"); const input=combo&&combo.querySelector("input"); if(!input)return;
  input.value=sel.value;
  input.dispatchEvent(new Event("input",{bubbles:true}));
  input.dispatchEvent(new Event("change",{bubbles:true}));
  sel.selectedIndex=0;
});
window.addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")flushSave(); });
/* ---- Arch Profiler round-trip: the standalone window writes localStorage['rb_arch_result_'+tid]; merge it back into
   the treatment's conform on focus (same tab returns) or a storage event (still-open child), then clear the key. ---- */
function mergeArchResults(){ let merged=false;
  (S.treatments||[]).forEach(t=>{ const k="rb_arch_result_"+t.id; let raw; try{ raw=localStorage.getItem(k); }catch(e){ return; }
    if(!raw) return; let r; try{ r=JSON.parse(raw); }catch(e){ localStorage.removeItem(k); return; }
    if(!t.conform||typeof t.conform!=="object"||Array.isArray(t.conform)) t.conform=cfmDefault();
    if(Array.isArray(r.stations)) t.conform.stations=r.stations.filter(s=>s&&typeof s==="object").map(s=>({pos:(s.pos==null?"":String(s.pos)),h:(s.h==null?"":String(s.h))}));
    if(typeof r.symmetric==="boolean") t.conform.symmetric=r.symmetric;
    if(r.peak!=null) t.conform.peak=String(r.peak);
    if(r.span!=null&&String(r.span).trim()!=="") t.conform.openW=String(r.span);
    t.conform.on=true;
    try{ localStorage.removeItem(k); }catch(e){}
    merged=true; });
  if(merged){ save(); render(); const c=document.getElementById("savechip"); if(c){ c.textContent="Arch saved"; setTimeout(()=>{ c.textContent="Saved"; },2200); } }
}
window.addEventListener("focus",mergeArchResults);
window.addEventListener("storage",e=>{ if(e&&e.key&&e.key.indexOf("rb_arch_result_")===0) mergeArchResults(); });
{ const av=document.getElementById("appver"); if(av)av.textContent="beta "+APP_VERSION; }
render();
/* ---- #import= direct-load link: /survey/#import=<URL-safe base64 of the survey JSON> ----
   The scope rides entirely in the URL fragment (never sent to any server); it is decoded, migrated
   (migrateSurvey inside importSurveyObject) and saved as a NEW project - same path as paste/PDF import.
   The hash is cleared afterward (success OR failure) so a reload never re-fires the import. */
(function(){
  const h=location.hash||"";
  if(h.indexOf("#import=")!==0)return;
  const clearHash=()=>{ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; } };
  const linkStatus=(msg,ok)=>{ importStatus(msg,ok);   // mirrored into the modal's status line
    const c=document.getElementById("savechip"); if(c){ c.textContent=msg; setTimeout(()=>{ c.textContent="Saved"; },5000); } };
  try{
    let b64=h.slice(8);
    try{ b64=decodeURIComponent(b64); }catch(e){}                 // tolerate a URI-encoded payload
    b64=b64.replace(/-/g,"+").replace(/_/g,"/");                  // URL-safe -> standard base64
    while(b64.length%4)b64+="=";
    const bin=atob(b64);
    const json=new TextDecoder("utf-8").decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
    importSurveyObject(JSON.parse(json),linkStatus);              // sets its own success/failure status
  }catch(e){ linkStatus("Link import failed: "+((e&&e.message)||e),false); }
  clearHash();
})();
fetchPending().then(ok=>{ if(ok)safeRender(); });
</script>
